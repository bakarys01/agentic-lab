services:
  policy-agent:
    build:
      context: .
      dockerfile: Dockerfile.policy
    environment:
      A2A_BIND_HOST: "0.0.0.0"
      POLICY_AGENT_PORT: "9999"
      POLICY_AGENT_PUBLIC_URL: "http://policy-agent:9999"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    restart: unless-stopped
    networks:
      - agentic-network

  research-agent:
    build:
      context: .
      dockerfile: Dockerfile.research
    environment:
      A2A_BIND_HOST: "0.0.0.0"
      RESEARCH_AGENT_PORT: "9998"
      RESEARCH_AGENT_PUBLIC_URL: "http://research-agent:9998"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    restart: unless-stopped
    networks:
      - agentic-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"

      POLICY_AGENT_PUBLIC_URL: "http://policy-agent:9999"
      RESEARCH_AGENT_PUBLIC_URL: "http://research-agent:9998"

      OPENAI_API_KEY: "${OPENAI_API_KEY}"
    ports:
      - "8000:8000"
    depends_on:
      - policy-agent
      - research-agent
    restart: unless-stopped
    networks:
      - agentic-network

networks:
  agentic-network:
    driver: bridge