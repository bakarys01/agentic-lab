services:
  medication-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: medication
      POSTGRES_USER: medication
      POSTGRES_PASSWORD: "${MEDICATION_DB_PASSWORD:?Set MEDICATION_DB_PASSWORD}"
    volumes:
      - medication-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medication -d medication"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - agentic-network

  medication-importer:
    profiles: ["import"]
    build:
      context: .
      dockerfile: Dockerfile.agent
    entrypoint: ["python", "-m", "scrapping.import_medications"]
    command: ["--limit", "500"]
    environment:
      PGHOST: medication-db
      PGDATABASE: medication
      PGUSER: medication
      PGPASSWORD: "${MEDICATION_DB_PASSWORD:?Set MEDICATION_DB_PASSWORD}"
    depends_on:
      medication-db:
        condition: service_healthy
    networks:
      - agentic-network

  pgadmin:
    profiles: ["admin"]
    image: dpage/pgadmin4:9.18.0
    environment:
      PGADMIN_DEFAULT_EMAIL: "${PGADMIN_EMAIL-}"
      PGADMIN_DEFAULT_PASSWORD: "${PGADMIN_PASSWORD-}"
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./config/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      medication-db:
        condition: service_healthy
    networks:
      - agentic-network

  policy-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["python", "-m", "a2a_servers.serve", "policy"]
    environment:
      A2A_BIND_HOST: "0.0.0.0"
      POLICY_AGENT_PUBLIC_URL: "http://policy-agent:9999"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9999/.well-known/agent-card.json', timeout=5).close()"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - agentic-network

  research-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["python", "-m", "a2a_servers.serve", "research"]
    environment:
      A2A_BIND_HOST: "0.0.0.0"
      RESEARCH_AGENT_PUBLIC_URL: "http://research-agent:9998"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9998/.well-known/agent-card.json', timeout=5).close()"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - agentic-network

  healthcare-provider-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["python", "-m", "a2a_servers.serve", "healthcare_provider"]
    environment:
      A2A_BIND_HOST: "0.0.0.0"
      HEALTHCARE_PROVIDER_AGENT_PUBLIC_URL: "http://healthcare-provider-agent:9997"
      HF_TOKEN: "${HF_TOKEN:?Set HF_TOKEN}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9997/.well-known/agent-card.json', timeout=5).close()"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - agentic-network

  medication-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command: ["python", "-m", "a2a_servers.serve", "medication"]
    environment:
      A2A_BIND_HOST: "0.0.0.0"
      MEDICATION_AGENT_PUBLIC_URL: "http://medication-agent:9996"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY}"
      PGHOST: medication-db
      PGDATABASE: medication
      PGUSER: medication
      PGPASSWORD: "${MEDICATION_DB_PASSWORD:?Set MEDICATION_DB_PASSWORD}"
    depends_on:
      medication-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9996/.well-known/agent-card.json', timeout=5).close()"]
      interval: 15s
      timeout: 7s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - agentic-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8000"
      DATABASE_PATH: "/app/data/concierge.sqlite3"
      POLICY_AGENT_PUBLIC_URL: "http://policy-agent:9999"
      RESEARCH_AGENT_PUBLIC_URL: "http://research-agent:9998"
      HEALTHCARE_PROVIDER_AGENT_PUBLIC_URL: "http://healthcare-provider-agent:9997"
      MEDICATION_AGENT_PUBLIC_URL: "http://medication-agent:9996"
      OPENAI_API_KEY: "${OPENAI_API_KEY:?Set OPENAI_API_KEY}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=10); result = json.load(response); assert result.get('status') == 'ok', result"]
      interval: 15s
      timeout: 12s
      retries: 5
      start_period: 30s
    depends_on:
      policy-agent:
        condition: service_healthy
      research-agent:
        condition: service_healthy
      healthcare-provider-agent:
        condition: service_healthy
      medication-agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - agentic-network

networks:
  agentic-network:
    driver: bridge

volumes:
  backend-data:
  medication-db-data:
  pgadmin-data:
