[project]
name = "my-agents"
version = "0.1.0"
description = "Healthcare concierge with a browser chat and A2A specialist agents"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk[http-server]>=1.1.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-huggingface>=1.2.2",
    "langchain-mcp-adapters>=0.3.2",
    "mcp>=1.9.0,<2",
    "pydantic>=2.0",
    "pymupdf>=1.28.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "smolagents[openai,toolkit]>=1.26.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.1.0",
    "selenium>=4.49.0",
]
