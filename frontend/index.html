<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MediNova — Health Concierge</title>
    <meta name="description" content="Ask the health concierge about healthcare and your insurance policy." />
    <link rel="stylesheet" href="/styles.css?v=20260925-chat-2" />
    <script src="/app.js?v=20260925-chat-2" defer></script>
  </head>
  <body>
    <header class="browser-bar">
      <a class="home-link" href="/" aria-label="MediNova home">MediNova<span class="brand-dot" aria-hidden="true"></span></a>
      <button id="check-connection" class="connection-button" type="button" data-state="checking" title="Check concierge connection">
        <span class="status-light" aria-hidden="true"></span>
        <span id="connection-status" role="status">Checking</span>
      </button>
    </header>
    <main class="hero">
      <div class="welcome">
        <h1>How can I help?</h1>
        <p>Healthcare and insurance, made clearer.</p>
      </div>
      <section id="conversation" class="conversation hidden" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions text">
        <article class="chat-result hidden" id="chat-result" aria-atomic="true" aria-label="Concierge response">
          <h2 class="result-label">MediNova</h2>
          <p id="result-text" class="message-text"></p>
          <p id="result-meta" class="result-meta"></p>
        </article>
      </section>
      <div class="composer">
        <form class="ask-form" id="ask-form" aria-label="Medical question form">
          <input id="medical-input" name="message" type="text" required maxlength="8000"
            placeholder="Ask a question…" aria-label="Medical question" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
        <p id="composer-error" class="composer-error" role="alert"></p>
      </div>
      <section id="capabilities" class="capabilities" aria-label="Example questions">
        <button class="action-pill" type="button" data-prompt="How much would I pay for mental health therapy under my insurance policy?">Does my insurance cover therapy?</button>
        <button class="action-pill" type="button" data-prompt="What are the common treatment options for sleep apnea?">What treatments help sleep apnea?</button>
        <button class="action-pill" type="button" data-prompt="What is the difference between a copay and a deductible?">What is a copay or deductible?</button>
      </section>
    </main>
  </body>
</html>
