version: 1

agents:
  policy:
    role: specialist
    runtime: langchain
    description: >-
      Answers questions about the user's insurance policy, including coverage,
      deductibles, copays, coinsurance and exclusions. Does not give medical advice
      or find doctors.
    prompt: policy
    execution: policy
    tools:
      - search_policy
    mcp_servers:
      - policy_documents

  research:
    role: specialist
    runtime: langchain
    description: >-
      Researches general medical questions about conditions, symptoms and
      treatments using web sources. Does not determine insurance coverage
      or find doctors in the provider directory.
    prompt: research
    tools:
      - web_search
    mcp_servers:
      - research_web

  concierge:
    role: manager
    description: Coordinates insurance, healthcare, and medication specialists.
    prompt: concierge
    tools: []
    delegates:
      - policy
      - research
      - healthcare_provider
      - medication

  healthcare_provider:
    role: specialist
    description: >-
      Finds doctors by city, region or medical specialty in the provider directory.
      Does not determine insurance coverage or appointment availability.
    runtime: langchain
    model: provider_search
    prompt: healthcare_provider
    tools:
      - list_doctors
    mcp_servers:
      - healthcare_providers

  medication:
    role: specialist
    runtime: langchain
    description: >-
      Finds structured medication facts, including CIS/CIP codes, pharmaceutical
      forms, presentations, substances and dosages in the BDPM sample. Does not
      answer questions about indications, safety, prices or insurance coverage.
    prompt: medication
    tools:
      - get_medication
    mcp_servers:
      - medication_catalog

execution_profiles:
  default:
    max_steps: 8

  policy:
    max_steps: 6

models:
  default:
    provider: openai
    model_id: gpt-4o
    api_key_env: OPENAI_API_KEY

  title:
    provider: openai
    model_id: gpt-4o-mini
    api_key_env: OPENAI_API_KEY

  provider_search:
    provider: huggingface
    model_id: openai/gpt-oss-20b
    api_key_env: HF_TOKEN

mcp_servers:
  policy_documents:
    transport: stdio
    script: src/medinova/mcp_servers/policy.py
    allowed_tools:
      - search_policy

  research_web:
    transport: stdio
    script: src/medinova/mcp_servers/research.py
    allowed_tools:
      - web_search

  healthcare_providers:
    transport: stdio
    script: src/medinova/mcp_servers/healthcare.py
    allowed_tools:
      - list_doctors

  medication_catalog:
    transport: stdio
    script: src/medinova/mcp_servers/medication.py
    allowed_tools:
      - get_medication
    env_vars:
      - PGHOST
      - PGDATABASE
      - PGUSER
      - PGPASSWORD


a2a_servers:
  policy:
    port: 9999
  research:
    port: 9998
  healthcare_provider:
    port: 9997
  medication:
    port: 9996
